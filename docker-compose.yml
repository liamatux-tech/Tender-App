services:
  tender-app:
    build: .
    restart: unless-stopped
    expose:
      - "5000"
    networks:
      - edge
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  edge:
    external: true
